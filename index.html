<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>仏検対策</title>
    <style>
        /* 洗練されたフレンチモダン・カラー */
        :root { 
            --bleu: #0055A4; 
            --blanc: #FFFFFF; 
            --rouge: #EF4135; 
            --text-main: #1D1D1F; 
            --text-light: #86868B;
            --bg-color: #F5F5F7;
            --border: #E5E5EA;
            --btn-bg: #F5F5F7;
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Segoe UI", Arial, sans-serif;
            background-color: var(--bg-color); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            color: var(--text-main); 
            -webkit-font-smoothing: antialiased;
        }

        #app-container { 
            background: var(--blanc); 
            padding: 3rem 2.5rem; 
            border-radius: 24px; 
            box-shadow: 0 4px 24px rgba(0,0,0,0.04); 
            width: 90%; 
            max-width: 400px; 
            text-align: center; 
        }

        .screen { display: none; animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        .screen.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

        h1 { font-weight: 700; font-size: 1.4rem; margin-bottom: 2rem; color: var(--text-main); letter-spacing: 0.5px; }

        /* バッジ */
        .level-badge { 
            background: var(--bleu); 
            color: var(--blanc); 
            padding: 4px 12px; 
            border-radius: 8px; 
            font-size: 0.75rem; 
            font-weight: 600; 
            letter-spacing: 0.5px;
            margin-bottom: 1rem; 
            display: inline-block; 
        }

        /* 選択ボタン */
        .menu-grid { display: grid; grid-template-columns: 1fr; gap: 10px; margin-top: 20px; }
        .menu-btn { 
            width: 100%; 
            padding: 16px; 
            border: 1px solid transparent; 
            border-radius: 12px; 
            cursor: pointer; 
            font-size: 1rem; 
            background: var(--btn-bg); 
            color: var(--text-main);
            transition: all 0.2s ease;
            font-weight: 500;
        }
        .menu-btn:hover:not(:disabled) { 
            border-color: var(--bleu); 
            color: var(--bleu);
            background: #F0F7FF;
        }
        .btn-mix { background: var(--bleu); color: var(--blanc); font-weight: 600; margin-top: 8px; }
        .btn-mix:hover:not(:disabled) { background: #004488; color: var(--blanc); }
        .btn-typing { border: 1px dashed var(--text-light); background: transparent; color: var(--text-main); }

        /* 分析エリア */
        .stats-card { margin-bottom: 2rem; text-align: left; }
        .stat-row { margin-bottom: 12px; }
        .stat-label { font-size: 0.75rem; color: var(--text-light); display: flex; justify-content: space-between; margin-bottom: 6px; font-weight: 600; }
        .bar-bg { background: var(--border); height: 4px; border-radius: 2px; overflow: hidden; }
        .bar-fill { background: var(--bleu); height: 100%; width: 0%; transition: width 0.8s ease; }
        .weak { background: var(--rouge) !important; }

        /* クイズ画面 */
        .question-text { font-size: 1.6rem; font-weight: 700; margin: 1rem 0; color: var(--text-main); line-height: 1.4; min-height: 3.5rem; display: flex; align-items: center; justify-content: center; }
        .meaning { color: var(--text-light); margin-bottom: 2rem; font-size: 0.95rem; }
        .grid-choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

        /* タイピング入力 */
        #typing-input { 
            width: 90%; padding: 14px; font-size: 1.1rem; border: 1px solid var(--bleu); border-radius: 12px; 
            text-align: center; outline: none; color: var(--text-main); background: #fff; margin: 0 auto; display: block;
        }

        /* フィードバック・解説 */
        #feedback { margin-top: 1.5rem; font-weight: 600; font-size: 1.2rem; height: 1.5rem; }
        #feedback-area { display: none; margin-top: 1rem; }
        
        /* 解説ボックス */
        #commentary-box { 
            background: var(--btn-bg); 
            border-left: 3px solid var(--rouge); 
            padding: 1.2rem; 
            text-align: left; 
            font-size: 0.9rem; 
            line-height: 1.6; 
            color: var(--text-main);
            border-radius: 0 12px 12px 0;
            margin-bottom: 15px;
        }
        
        /* 再生ボタン */
        #audio-repeat-btn { 
            background: none; color: var(--bleu); border: 1px solid var(--bleu); border-radius: 50%; 
            width: 44px; height: 44px; cursor: pointer; margin: 0 auto 15px auto; 
            display: flex; align-items: center; justify-content: center; font-size: 1.2rem;
            transition: all 0.2s;
        }
        #audio-repeat-btn:hover { background: var(--bleu); color: var(--blanc); }

        .progress { margin-top: 2rem; color: var(--text-light); font-size: 0.8rem; font-weight: 500; letter-spacing: 0.5px; }
        button:disabled { opacity: 0.4; cursor: not-allowed; }
        .clear-btn { background: none; border: none; color: var(--text-light); font-size: 0.75rem; cursor: pointer; margin-top: 15px; width: 100%; text-align: center; transition: 0.2s; }
        .clear-btn:hover { color: var(--rouge); }
    </style>
</head>
<body>

<div id="app-container">
    <div id="loading-screen" class="screen active">
        <h1 style="color:var(--text-light)">Chargement...</h1>
    </div>

    <div id="menu-screen" class="screen">
        <h1>FRANC TEST</h1>
        <div class="stats-card">
            <div id="stats-list"></div>
            <button class="clear-btn" onclick="clearHistory()">履歴リセット</button>
        </div>
        <div class="menu-grid">
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
                <button class="menu-btn" onclick="startQuiz('5級', 'choice')">5級</button>
                <button class="menu-btn" onclick="startQuiz('4級', 'choice')">4級</button>
                <button class="menu-btn" onclick="startQuiz('3級', 'choice')">3級</button>
                <button class="menu-btn" onclick="startQuiz('2級', 'choice')">2級</button>
            </div>
            <button class="menu-btn btn-mix" onclick="startQuiz('ALL', 'choice')">全級ミックス</button>
            <button class="menu-btn btn-typing" onclick="startQuiz('ALL', 'typing')">⌨️ タイピング</button>
        </div>
    </div>

    <div id="quiz-screen" class="screen">
        <div id="level-tag" class="level-badge"></div>
        <div id="question-display" class="question-text"></div>
        <div id="meaning-display" class="meaning"></div>
        
        <div id="choices-container" class="grid-choices"></div>
        <div id="typing-container" style="display:none;">
            <input type="text" id="typing-input" autocomplete="off" spellcheck="false">
        </div>

        <div id="feedback"></div>

        <div id="feedback-area">
            <div id="commentary-box"><span id="commentary-text"></span></div>
            <button id="audio-repeat-btn" onclick="replayAudio()">🔊</button>
            <button id="next-btn" class="menu-btn btn-mix" onclick="handleNext()">Suivant (次へ)</button>
        </div>

        <div class="progress">Question <span id="current-count">0</span> / 10</div>
    </div>

    <div id="result-screen" class="screen">
        <h2 style="color: var(--text-light); font-size: 1rem; font-weight: 500;">Résultat</h2>
        <div style="font-size: 4.5rem; font-weight: 700; color: var(--bleu); margin: 1rem 0;" id="final-score">0</div>
        <p id="evaluation-msg" style="margin-bottom: 2rem; color: var(--text-light); font-size: 0.95rem;"></p>
        <button class="menu-btn btn-mix" onclick="location.reload()">ダッシュボードへ</button>
    </div>
</div>

<script>
    let database = [];
    let currentQuestions = [];
    let currentIndex = 0;
    let score = 0;
    let currentMode = 'choice';
    let lastSpokenText = "";
    
    let synth = window.speechSynthesis || null;
    let voices = [];

    let history = {};
    try {
        const saved = localStorage.getItem('fuken_history');
        if (saved) {
            history = JSON.parse(saved);
        }
    } catch (e) {
        history = {};
    }

    function initSpeech() {
        if (!synth) return;
        try {
            const silentUtterance = new SpeechSynthesisUtterance("");
            synth.speak(silentUtterance);
            loadVoices();
        } catch(e) {}
    }

    function loadVoices() {
        if (!synth) return;
        voices = synth.getVoices();
        if (synth.onvoiceschanged !== undefined) {
            synth.onvoiceschanged = () => { voices = synth.getVoices(); };
        }
    }

    function speakFrench(text) {
        if (!synth) return;
        try {
            synth.cancel();
            const uttr = new SpeechSynthesisUtterance(text);
            uttr.lang = 'fr-FR';
            uttr.rate = 0.85;
            const frVoice = voices.find(v => v.lang.includes('fr'));
            if (frVoice) uttr.voice = frVoice;
            synth.speak(uttr);
            lastSpokenText = text;
        } catch (e) { console.warn("Speech error:", e); }
    }

    function replayAudio() { if (lastSpokenText) speakFrench(lastSpokenText); }

    function saveResult(cat, isCorrect) {
        try {
            if (!history[cat]) history[cat] = { correct: 0, total: 0 };
            history[cat].total += 1;
            if (isCorrect) history[cat].correct += 1;
            localStorage.setItem('fuken_history', JSON.stringify(history));
        } catch(e) {}
    }

    function renderStats() {
        const list = document.getElementById('stats-list');
        list.innerHTML = "";
        const categories = ["名詞の性", "動詞の活用", "前置詞・文法", "熟語・表現"];
        categories.forEach(cat => {
            const data = history[cat] || { correct: 0, total: 0 };
            const percent = data.total > 0 ? Math.round((data.correct / data.total) * 100) : 0;
            let colorClass = (percent < 60 && data.total > 0) ? "weak" : "";
            list.innerHTML += `<div class="stat-row"><div class="stat-label"><span>${cat}</span><span>${percent}%</span></div><div class="bar-bg"><div class="bar-fill ${colorClass}" style="width: ${percent}%"></div></div></div>`;
        });
    }

    function clearHistory() {
        if (confirm("履歴をリセットしますか？")) {
            localStorage.removeItem('fuken_history'); 
            history = {}; 
            renderStats();
        }
    }

    async function loadData() {
        try {
            const response = await fetch('questions.json?t=' + Date.now());
            if (!response.ok) throw new Error("JSON読み込み失敗");
            
            database = await response.json();
            
            renderStats();
            document.getElementById('loading-screen').classList.remove('active');
            document.getElementById('menu-screen').classList.add('active');
            loadVoices();
        } catch (e) { 
            document.getElementById('loading-screen').innerHTML = `
                <h1 style="color:var(--rouge); font-size:1.2rem;">エラーが発生しました</h1>
                <p style="color:var(--text-light); font-size:0.9rem;">JSONデータを確認してください。</p>`;
        }
    }

    function startQuiz(lvl, mode) {
        initSpeech();
        currentMode = mode;
        let filtered = database;

        // 【修正】レベルとモードによる絞り込みを明確化
        if (lvl !== 'ALL') filtered = filtered.filter(q => q.level === lvl);
        if (mode === 'typing') filtered = filtered.filter(q => q.type === 'gender'); // タイピングは名詞の性（le/la/l'）のみにする

        currentQuestions = filtered.sort(() => 0.5 - Math.random()).slice(0, 10);
        if (currentQuestions.length === 0) return alert("該当する問題がありません");
        currentIndex = 0; score = 0;
        switchScreen('quiz-screen');
        showQuestion();
    }

    function getCategory(q) {
        if (q.category) return q.category;
        if (q.type === 'gender') return "名詞の性";
        return "前置詞・文法";
    }

    function getDefArticle(word, gender) {
        if (!word || word.length === 0) return "";
        const vowels = ['a', 'e', 'i', 'o', 'u', 'y', 'h', 'é', 'è', 'ê', 'à', 'â', 'î', 'ï', 'ô', 'û', 'ù'];
        if (vowels.includes(word[0].toLowerCase())) return "l'";
        return (gender === "男性") ? "le " : "la ";
    }

    function showQuestion() {
        const q = currentQuestions[currentIndex];
        document.getElementById('level-tag').textContent = q.level;
        document.getElementById('current-count').textContent = currentIndex + 1;
        document.getElementById('question-display').textContent = q.type === 'gender' ? q.word : q.word_or_question;
        document.getElementById('meaning-display').textContent = q.meaning;
        document.getElementById('feedback').textContent = "";
        document.getElementById('feedback-area').style.display = "none";
        
        const choicesDiv = document.getElementById('choices-container');
        const typingDiv = document.getElementById('typing-container');
        const input = document.getElementById('typing-input');

        if (currentMode === 'choice') {
            choicesDiv.style.display = 'grid';
            typingDiv.style.display = 'none';
            choicesDiv.innerHTML = "";
            const choices = q
