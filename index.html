<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>仏検完全対策：フラ単ナビ</title>
    <style>
        :root { --primary: #002395; --accent: #EF4135; --bg: #f0f2f5; }
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background-color: var(--bg); display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        #app-container { background: white; padding: 2rem; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 95%; max-width: 450px; text-align: center; }
        
        .screen { display: none; }
        .screen.active { display: block; }

        h1 { color: var(--primary); font-size: 1.5rem; margin-bottom: 1.5rem; }
        .level-badge { background: var(--primary); color: white; padding: 4px 12px; border-radius: 20px; font-size: 0.8rem; margin-bottom: 0.5rem; display: inline-block; }

        .menu-grid { display: grid; grid-template-columns: 1fr; gap: 15px; }
        .menu-btn { padding: 15px; border: 2px solid #eee; border-radius: 12px; cursor: pointer; font-size: 1.1rem; font-weight: bold; transition: 0.3s; background: white; }
        .menu-btn:hover:not(:disabled) { border-color: var(--primary); background: #f0f4ff; }

        .question-text { font-size: 1.4rem; font-weight: bold; margin: 1.5rem 0; min-height: 4rem; display: flex; align-items: center; justify-content: center; }
        .meaning { color: #666; margin-bottom: 1.5rem; font-size: 0.95rem; }
        .grid-choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        
        button:disabled { opacity: 0.6; cursor: not-allowed; }
        #feedback { margin-top: 1rem; font-weight: bold; height: 1.5rem; font-size: 1.2rem; }
        .progress { margin-top: 1rem; color: #888; font-size: 0.8rem; }
    </style>
</head>
<body>

<div id="app-container">
    <!-- 読み込み中画面 -->
    <div id="loading-screen" class="screen active">
        <h1>Loading...</h1>
        <p>問題を読み込んでいます</p>
    </div>

    <!-- メニュー画面 -->
    <div id="menu-screen" class="screen">
        <h1>仏検対策ドリル</h1>
        <p>級を選んでスタート！</p>
        <div class="menu-grid">
            <button class="menu-btn" onclick="startQuiz('5級')">5級レベル</button>
            <button class="menu-btn" onclick="startQuiz('4級')">4級レベル</button>
            <button class="menu-btn" onclick="startQuiz('3級')">3級レベル</button>
        </div>
    </div>

    <!-- クイズ画面 -->
    <div id="quiz-screen" class="screen">
        <div id="level-tag" class="level-badge"></div>
        <div id="question-display" class="question-text"></div>
        <div id="meaning-display" class="meaning"></div>
        <div id="choices-container" class="grid-choices"></div>
        <div id="feedback"></div>
        <div class="progress">問題: <span id="current-count">0</span> / 10</div>
    </div>

    <!-- 結果画面 -->
    <div id="result-screen" class="screen">
        <h2>結果発表</h2>
        <div style="font-size: 4rem; font-weight: bold; color: var(--primary);" id="final-score">0</div>
        <button class="menu-btn" style="width:100%; margin-top:1rem;" onclick="location.reload()">メニューに戻る</button>
    </div>
</div>

<script>
    let database = [];
    let currentQuestions = [];
    let currentIndex = 0;
    let score = 0;

    // 音を出す設定
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(isCorrect) {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.frequency.setValueAtTime(isCorrect ? 880 : 220, audioCtx.currentTime);
        osc.start();
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
        osc.stop(audioCtx.currentTime + 0.5);
    }

    // JSONを読み込む
    async function loadData() {
        try {
            // URLはGitHub Pagesにアップした後、'questions.json' のままでOKです
            const response = await fetch('questions.json');
            if (!response.ok) throw new Error('Network response was not ok');
            database = await response.json();
            switchScreen('menu-screen');
        } catch (error) {
            document.getElementById('loading-screen').innerHTML = "<h1>Error</h1><p>問題データの読み込みに失敗しました。</p>";
            console.error("Failed to load questions:", error);
        }
    }

    function startQuiz(lvl) {
        currentQuestions = database.filter(q => q.level === lvl).sort(() => 0.5 - Math.random()).slice(0, 10);
        if (currentQuestions.length === 0) return alert("まだ問題がありません");
        currentIndex = 0; score = 0;
        switchScreen('quiz-screen');
        showQuestion();
    }

    function showQuestion() {
        const q = currentQuestions[currentIndex];
        document.getElementById('level-tag').textContent = q.level;
        document.getElementById('current-count').textContent = currentIndex + 1;
        document.getElementById('feedback').textContent = "";
        
        document.getElementById('question-display').textContent = q.type === 'gender' ? q.word : q.word_or_question;
        document.getElementById('meaning-display').textContent = q.meaning;
        
        const container = document.getElementById('choices-container');
        container.innerHTML = "";
        
        const choices = q.type === 'gender' ? ["男性", "女性"] : [q.choice1, q.choice2, q.choice3, q.choice4].filter(c => c);
        
        choices.forEach(c => {
            const btn = document.createElement('button');
            btn.className = 'menu-btn';
            btn.textContent = c;
            btn.onclick = () => check(c, q.answer);
            container.appendChild(btn);
        });
    }

    function check(selected, correct) {
        const isCorrect = (selected === correct);
        const fb = document.getElementById('feedback');
        fb.textContent = isCorrect ? "C'est bien !" : "正解: " + correct;
        fb.style.color = isCorrect ? "#4CAF50" : "#EF4135";
        
        if (isCorrect) score++;
        playSound(isCorrect);

        const buttons = document.querySelectorAll('#choices-container button');
        buttons.forEach(b => b.disabled = true);

        setTimeout(() => {
            currentIndex++;
            if (currentIndex < currentQuestions.length) showQuestion();
            else showResult();
        }, 1200);
    }

    function showResult() {
        switchScreen('result-screen');
        document.getElementById('final-score').textContent = score + " / " + currentQuestions.length;
    }

    function switchScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    // 起動時にデータを読み込む
    loadData();
</script>
</body>
</html>
