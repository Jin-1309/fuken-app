<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>仏検対策ドリル</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        /* 洗練されたフレンチモダン・カラー */
        :root { 
            --bleu: #0055A4; 
            --blanc: #FFFFFF; 
            --rouge: #EF4135; 
            --text-main: #1D1D1F; 
            --text-light: #86868B;
            --bg-color: #F5F5F7;
            --border: #E5E5EA;
            --btn-bg: #F5F5F7;
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Segoe UI", Arial, sans-serif;
            background-color: var(--bg-color); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            color: var(--text-main); 
            -webkit-font-smoothing: antialiased;
        }

        #app-container { 
            background: var(--blanc); 
            padding: 2.5rem 2rem; 
            border-radius: 24px; 
            box-shadow: 0 4px 24px rgba(0,0,0,0.04); 
            width: 90%; 
            max-width: 400px; 
            text-align: center; 
            max-height: 90vh;
            overflow-y: auto;
        }
        
        #app-container::-webkit-scrollbar { width: 6px; }
        #app-container::-webkit-scrollbar-thumb { background-color: #cbd5e0; border-radius: 3px; }

        .screen { display: none; animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        .screen.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

        h1 { font-weight: 700; font-size: 1.4rem; margin-bottom: 2rem; color: var(--text-main); letter-spacing: 0.5px; }

        .level-badge { 
            background: var(--bleu); 
            color: var(--blanc); 
            padding: 4px 12px; 
            border-radius: 8px; 
            font-size: 0.75rem; 
            font-weight: 600; 
            letter-spacing: 0.5px;
            margin-bottom: 1rem; 
            display: inline-block; 
        }

        .section-title {
            font-size: 0.85rem; 
            font-weight: 700; 
            color: var(--text-light); 
            text-align: left; 
            margin: 1.5rem 0 0.5rem 0; 
            border-bottom: 1px solid var(--border); 
            padding-bottom: 6px;
        }

        .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
        .span-2 { grid-column: span 2; }
        .menu-btn { 
            width: 100%; 
            padding: 16px; 
            border: 1px solid transparent; 
            border-radius: 12px; 
            cursor: pointer; 
            font-size: 0.95rem; 
            background: var(--btn-bg); 
            color: var(--text-main);
            transition: all 0.2s ease;
            font-weight: 500;
        }
        .menu-btn:hover:not(:disabled) { 
            border-color: var(--bleu); 
            color: var(--bleu);
            background: #F0F7FF;
        }
        .btn-mix { background: var(--bleu); color: var(--blanc); font-weight: 600; margin-top: 8px; }
        .btn-mix:hover:not(:disabled) { background: #004488; color: var(--blanc); }
        .btn-weak { border: 2px solid var(--rouge); color: var(--rouge); background: var(--blanc); font-weight: 600; margin-top: 8px; }
        .btn-weak:hover:not(:disabled) { background: #FFF5F5; }
        .btn-typing { border: 1px dashed var(--text-light); background: transparent; color: var(--text-main); margin-top: 8px;}

        .stats-card { margin-bottom: 1rem; text-align: left; }
        .stat-row { margin-bottom: 12px; }
        .stat-label { font-size: 0.75rem; color: var(--text-light); display: flex; justify-content: space-between; margin-bottom: 6px; font-weight: 600; }
        .bar-bg { background: var(--border); height: 4px; border-radius: 2px; overflow: hidden; }
        .bar-fill { background: var(--bleu); height: 100%; width: 0%; transition: width 0.8s ease; }
        .weak { background: var(--rouge) !important; }

        .question-text { font-size: 1.5rem; font-weight: 700; margin: 1rem 0; color: var(--text-main); line-height: 1.5; min-height: 3.5rem; display: flex; align-items: center; justify-content: center; }
        .meaning { color: var(--text-light); margin-bottom: 2rem; font-size: 0.95rem; line-height: 1.5; }
        .grid-choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

        #typing-input { 
            width: 90%; padding: 14px; font-size: 1.1rem; border: 1px solid var(--bleu); border-radius: 12px; 
            text-align: center; outline: none; color: var(--text-main); background: #fff; margin: 0 auto; display: block;
        }
        #typing-input::placeholder { color: #A0AEC0; font-size: 0.9rem; }

        #feedback { margin-top: 1.5rem; font-weight: 600; font-size: 1.2rem; height: 1.5rem; }
        #feedback-area { display: none; margin-top: 1rem; }
        
        #commentary-box { 
            background: var(--btn-bg); 
            border-left: 3px solid var(--rouge); 
            padding: 1.2rem; 
            text-align: left; 
            font-size: 0.9rem; 
            line-height: 1.6; 
            color: var(--text-main);
            border-radius: 0 12px 12px 0;
            margin-bottom: 15px;
        }
        
        #audio-repeat-btn { 
            background: none; color: var(--bleu); border: 1px solid var(--bleu); border-radius: 50%; 
            width: 44px; height: 44px; cursor: pointer; margin: 0 auto 15px auto; 
            display: flex; align-items: center; justify-content: center; font-size: 1.2rem;
            transition: all 0.2s;
        }
        #audio-repeat-btn:hover { background: var(--bleu); color: var(--blanc); }

        .progress { margin-top: 2rem; color: var(--text-light); font-size: 0.8rem; font-weight: 500; letter-spacing: 0.5px; }
        button:disabled { opacity: 0.4; cursor: not-allowed; }
        .clear-btn { background: none; border: none; color: var(--text-light); font-size: 0.75rem; cursor: pointer; margin-top: 15px; width: 100%; text-align: center; transition: 0.2s; text-decoration: underline; }
        .clear-btn:hover { color: var(--rouge); }
    </style>
</head>
<body>

<div id="app-container">
    <div id="loading-screen" class="screen active">
        <h1 style="color:var(--text-light)">Chargement...</h1>
        <p style="color:var(--text-light); font-size: 0.8rem;">データを同期しています</p>
    </div>

    <div id="menu-screen" class="screen">
        <h1>仏検対策ドリル</h1>
        <div class="stats-card">
            <div id="stats-list"></div>
            <button class="clear-btn" onclick="clearHistory()">学習履歴リセット</button>
        </div>

        <div class="section-title">📘 級別で学ぶ</div>
        <div class="menu-grid">
            <button class="menu-btn" onclick="startQuiz('5級', 'choice')">5級</button>
            <button class="menu-btn" onclick="startQuiz('4級', 'choice')">4級</button>
            <button class="menu-btn" onclick="startQuiz('3級', 'choice')">3級</button>
            <button class="menu-btn" onclick="startQuiz('2級', 'choice')">2級</button>
            <button class="menu-btn" onclick="startQuiz('準1級', 'choice')">準1級</button>
            <button class="menu-btn" onclick="startQuiz('1級', 'choice')">1級</button>
        </div>

        <div class="section-title">📂 カテゴリー集中特訓 (全級)</div>
        <div class="menu-grid">
            <button class="menu-btn" onclick="startQuiz('ALL', 'choice', '語彙')">語彙</button>
            <button class="menu-btn" onclick="startQuiz('ALL', 'choice', '前置詞')">前置詞</button>
            <button class="menu-btn" onclick="startQuiz('ALL', 'choice', '代名詞')">代名詞</button>
            <button class="menu-btn" onclick="startQuiz('ALL', 'choice', '動詞の活用')">動詞の活用</button>
            <button class="menu-btn" onclick="startQuiz('ALL', 'choice', '熟語・表現')">熟語・表現</button>
            <button class="menu-btn" onclick="startQuiz('ALL', 'choice', '会話・応答')">会話・応答</button>
            <button class="menu-btn span-2" onclick="startQuiz('ALL', 'choice', '長文読解')">長文読解</button>
        </div>

        <div class="section-title">🎯 総合テスト</div>
        <div style="display:flex; flex-direction:column;">
            <button class="menu-btn btn-mix" onclick="startQuiz('ALL', 'choice')">全級・全ジャンル ミックス</button>
            <button class="menu-btn btn-typing" onclick="startQuiz('ALL', 'typing')">⌨️ 全級タイピング挑戦</button>
        </div>
    </div>

    <div id="range-select-screen" class="screen">
        <h1>出題範囲の選択</h1>
        <p style="color:var(--text-light); font-size:0.9rem; margin-bottom: 2rem;">どの問題に挑戦しますか？</p>
        <div style="display:flex; flex-direction:column; gap:12px;">
            <button id="range-unlearned-btn" class="menu-btn btn-mix" onclick="confirmStartQuiz('unlearned')">🌱 未学習の問題 (...問)</button>
            <button id="range-weak-btn" class="menu-btn btn-weak" onclick="confirmStartQuiz('weak')">🔥 苦手な問題 (...問)</button>
            <button id="range-all-btn" class="menu-btn" onclick="confirmStartQuiz('all')">📚 すべての問題 (...問)</button>
        </div>
        <button class="clear-btn" style="margin-top:2rem; text-decoration:none;" onclick="switchScreen('menu-screen')">← メニューに戻る</button>
    </div>

    <div id="quiz-screen" class="screen">
        <div id="level-tag" class="level-badge"></div>
        <div id="question-display" class="question-text"></div>
        <div id="meaning-display" class="meaning"></div>
        
        <div id="choices-container" class="grid-choices"></div>
        <div id="typing-container" style="display:none;"><input type="text" id="typing-input" autocomplete="off" spellcheck="false"></div>
        <div id="feedback"></div>
        <div id="feedback-area">
            <div id="commentary-box"><span id="commentary-text"></span></div>
            <button id="audio-repeat-btn" onclick="replayAudio()">🔊</button>
            <button id="next-btn" class="menu-btn btn-mix" onclick="handleNext()">Suivant (次へ)</button>
        </div>
        <div class="progress">Question <span id="current-count">0</span> / <span id="total-count">10</span></div>
    </div>

    <div id="result-screen" class="screen">
        <h2 style="color: var(--text-light); font-size: 1rem; font-weight: 500;">Résultat</h2>
        <div style="font-size: 4.5rem; font-weight: 700; color: var(--bleu); margin: 1rem 0;" id="final-score">0</div>
        <p id="evaluation-msg" style="margin-bottom: 2rem; color: var(--text-light); font-size: 0.95rem;"></p>
        <button class="menu-btn btn-mix" onclick="location.reload()">ダッシュボードへ戻る</button>
    </div>
</div>

<script>
    // ==========================================
    // ⬇️ ここにスプレッドシートのURLを貼り付けます ⬇️
    const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQuzeEcmkxJGKFRuKb3GePTqgmONesfzZQffCn28tcGtjCgz5nvCM2lrx8pAPXb78YFmL4wCfLt-pdg/pub?output=csv";
    // ==========================================

    let database = [];
    let currentQuestions = [];
    let currentIndex = 0;
    let score = 0;
    let currentMode = 'choice';
    let lastSpokenText = "";
    let quizConfig = { lvl: 'ALL', mode: 'choice', targetCategory: 'ALL' };
    
    // --- 音声関連の初期化 ---
    let synth = window.speechSynthesis || null;
    let voices = [];
    
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx;

    // 電子音（ピコーン/ブブー）の初期化
    function initAudioContext() {
        if (!audioCtx) {
            audioCtx = new AudioContext();
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
    }

    // 正誤の電子音を鳴らす関数
    function playBeepSound(isCorrect) {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        
        if (isCorrect) {
            // 正解音（ピコーン）
            osc.type = 'sine';
            osc.frequency.setValueAtTime(880, audioCtx.currentTime); // ラ
            osc.frequency.exponentialRampToValueAtTime(1320, audioCtx.currentTime + 0.1); // ミ
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        } else {
            // 不正解音（ブブー）
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(220, audioCtx.currentTime); // 低いラ
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.3);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        }
    }

    function initSpeech() {
        if (!synth) return;
        try { synth.speak(new SpeechSynthesisUtterance("")); loadVoices(); } catch(e) {}
    }

    function loadVoices() {
        if (!synth) return;
        voices = synth.getVoices();
        if (synth.onvoiceschanged !== undefined) synth.onvoiceschanged = () => { voices = synth.getVoices(); };
    }

    function speakFrench(text) {
        if (!synth) return;
        try {
            synth.cancel();
            const cleanText = text.replace(/’/g, "'");
            const uttr = new SpeechSynthesisUtterance(cleanText);
            uttr.lang = 'fr-FR';
            uttr.rate = 0.85;
            const frVoice = voices.find(v => v.lang.includes('fr'));
            if (frVoice) uttr.voice = frVoice;
            synth.speak(uttr);
            lastSpokenText = cleanText;
        } catch (e) { console.warn("Speech error:", e); }
    }

    function replayAudio() { if (lastSpokenText) speakFrench(lastSpokenText); }

    let history = {};
    let answeredQuestions = [];
    let wrongQuestions = []; 

    try {
        if (localStorage.getItem('fuken_history')) history = JSON.parse(localStorage.getItem('fuken_history'));
        if (localStorage.getItem('fuken_answered')) answeredQuestions = JSON.parse(localStorage.getItem('fuken_answered'));
        if (localStorage.getItem('fuken_wrong')) wrongQuestions = JSON.parse(localStorage.getItem('fuken_wrong'));
    } catch (e) { history = {}; answeredQuestions = []; wrongQuestions = []; }

    function saveResult(cat, isCorrect) {
        try {
            if (!history[cat]) history[cat] = { correct: 0, total: 0 };
            history[cat].total += 1;
            if (isCorrect) history[cat].correct += 1;
            localStorage.setItem('fuken_history', JSON.stringify(history));
        } catch(e) {}
    }

    function renderStats() {
        const list = document.getElementById('stats-list');
        list.innerHTML = "";
        const categories = ["語彙", "前置詞", "代名詞", "動詞の活用", "熟語・表現", "会話・応答", "長文読解"];
        categories.forEach(cat => {
            const data = history[cat] || { correct: 0, total: 0 };
            if (data.total === 0) return; 
            const percent = Math.round((data.correct / data.total) * 100);
            let colorClass = (percent < 60) ? "weak" : "";
            list.innerHTML += `<div class="stat-row"><div class="stat-label"><span>${cat}</span><span>${percent}%</span></div><div class="bar-bg"><div class="bar-fill ${colorClass}" style="width: ${percent}%"></div></div></div>`;
        });
        if (list.innerHTML === "") list.innerHTML = "<p style='font-size:0.8rem; color:#888;'>問題を解くとここに正解率が表示されます。</p>";
    }

    function clearHistory() {
        if (confirm("正答率、未学習リスト、苦手リストをすべてリセットしますか？")) {
            localStorage.removeItem('fuken_history'); localStorage.removeItem('fuken_answered'); localStorage.removeItem('fuken_wrong'); 
            history = {}; answeredQuestions = []; wrongQuestions = []; renderStats();
        }
    }

    async function loadData() {
        if (SHEET_CSV_URL === "ここにURLを貼り付けます") {
            document.getElementById('loading-screen').innerHTML = `
                <h1 style="color:var(--rouge); font-size:1.2rem;">設定エラー</h1>
                <p style="color:var(--text-light); font-size:0.9rem;">コード内の <code>SHEET_CSV_URL</code> に<br>スプレッドシートのURLを貼り付けてください。</p>`;
            return;
        }

        try {
            const fetchUrl = SHEET_CSV_URL + (SHEET_CSV_URL.includes('?') ? '&' : '?') + 't=' + Date.now();
            
            database = await new Promise((resolve, reject) => {
                Papa.parse(fetchUrl, {
                    download: true,
                    header: true,
                    skipEmptyLines: true,
                    complete: function(results) { resolve(results.data); },
                    error: function(err) { reject(err); }
                });
            });
            
            renderStats();
            document.getElementById('loading-screen').classList.remove('active');
            document.getElementById('menu-screen').classList.add('active');
            loadVoices();
        } catch (e) { 
            document.getElementById('loading-screen').innerHTML = `
                <h1 style="color:var(--rouge); font-size:1.2rem;">エラーが発生しました</h1>
                <p style="color:var(--text-light); font-size:0.9rem;">スプレッドシートの読み込みに失敗しました。</p>`;
        }
    }

    function getCategory(q) {
        let cat = q.category || "";
        if (cat === "名詞の性" || q.type === "gender") return "語彙";
        if (cat === "前置詞・文法" || cat === "") {
            const text = (q.word_or_question || "").toLowerCase();
            if (/\b(qui|que|dont|lequel|laquelle|y|en|le|la|les|lui|leur|moi|toi)\b/.test(text)) return "代名詞";
            return "前置詞";
        }
        return cat;
    }

    function getQuestionId(q) {
        return q.level + "_" + q.type + "_" + (q.word || q.word_or_question);
    }

    function startQuiz(lvl, mode, targetCategory = 'ALL') {
        initSpeech();
        initAudioContext(); // ユーザーのクリックで電子音のエンジンを初期化
        quizConfig = { lvl, mode, targetCategory };
        
        let filtered = database;
        if (lvl !== 'ALL') filtered = filtered.filter(q => q.level === lvl);
        if (targetCategory !== 'ALL') filtered = filtered.filter(q => getCategory(q) === targetCategory);

        const totalCount = filtered.length;
        if (totalCount === 0) return alert("該当する問題がまだスプレッドシートに登録されていません。");

        const unlearnedCount = filtered.filter(q => !answeredQuestions.includes(getQuestionId(q))).length;
        const weakCount = filtered.filter(q => wrongQuestions.includes(getQuestionId(q))).length;

        document.getElementById('range-all-btn').textContent = `📚 すべての問題 (${totalCount}問から)`;
        
        const unlearnBtn = document.getElementById('range-unlearned-btn');
        if (unlearnedCount === 0) {
            unlearnBtn.disabled = true; unlearnBtn.textContent = `🌱 未学習の問題 (すべて学習済み🎉)`;
        } else {
            unlearnBtn.disabled = false; unlearnBtn.textContent = `🌱 未学習の問題 (${unlearnedCount}問から)`;
        }

        const weakBtn = document.getElementById('range-weak-btn');
        if (weakCount === 0) {
            weakBtn.disabled = true; weakBtn.textContent = `🔥 苦手な問題 (なし🎉)`;
        } else {
            weakBtn.disabled = false; weakBtn.textContent = `🔥 苦手な問題 (${weakCount}問から)`;
        }

        switchScreen('range-select-screen');
    }

    function confirmStartQuiz(range) {
        currentMode = quizConfig.mode;
        let filtered = database;

        if (quizConfig.lvl !== 'ALL') filtered = filtered.filter(q => q.level === quizConfig.lvl);
        if (quizConfig.targetCategory !== 'ALL') filtered = filtered.filter(q => getCategory(q) === quizConfig.targetCategory);

        if (range === 'unlearned') {
            filtered = filtered.filter(q => !answeredQuestions.includes(getQuestionId(q)));
        } else if (range === 'weak') {
            filtered = filtered.filter(q => wrongQuestions.includes(getQuestionId(q)));
        }

        currentQuestions = filtered.sort(() => 0.5 - Math.random()).slice(0, 10);
        currentIndex = 0; score = 0;
        document.getElementById('total-count').textContent = currentQuestions.length;
        switchScreen('quiz-screen');
        showQuestion();
    }

    function getDefArticle(word, gender) {
        if (!word || word.length === 0) return "";
        const vowels = ['a', 'e', 'i', 'o', 'u', 'y', 'h', 'é', 'è', 'ê', 'à', 'â', 'î', 'ï', 'ô', 'û', 'ù'];
        if (vowels.includes(word[0].toLowerCase())) return "l'";
        return (gender === "男性") ? "le " : "la ";
    }

    function showQuestion() {
        const q = currentQuestions[currentIndex];
        document.getElementById('level-tag').textContent = q.level;
        document.getElementById('current-count').textContent = currentIndex + 1;
        
        let qText = q.type === 'gender' ? (q.word || q.word_or_question) : q.word_or_question;
        document.getElementById('question-display').innerHTML = qText.replace(/\\n|\n/g, '<br>');
        document.getElementById('meaning-display').innerHTML = (q.meaning || "").replace(/\\n|\n/g, '<br>');
        
        document.getElementById('feedback').textContent = "";
        document.getElementById('feedback-area').style.display = "none";
        
        const choicesDiv = document.getElementById('choices-container');
        const typingDiv = document.getElementById('typing-container');
        const input = document.getElementById('typing-input');

        if (currentMode === 'choice') {
            choicesDiv.style.display = 'grid';
            typingDiv.style.display = 'none';
            choicesDiv.innerHTML = "";
            const choices = q.type === 'gender' ? ["男性", "女性"] : [q.choice1, q.choice2, q.choice3, q.choice4].filter(c => c !== undefined && c !== "");
            
            choices.forEach(c => {
                const btn = document.createElement('button');
                btn.className = 'menu-btn';
                btn.textContent = c;
                btn.onclick = () => { check(c); };
                choicesDiv.appendChild(btn);
            });
        } else {
            choicesDiv.style.display = 'none';
            typingDiv.style.display = 'block';
            input.style.display = 'block'; 
            input.value = ""; input.disabled = false;
            input.placeholder = (q.type === 'gender') ? "le / la / l'" : "答えを入力 (複数の場合は / で区切る)";
            setTimeout(() => input.focus(), 100);
        }
    }

    document.getElementById('typing-input').onkeypress = function(e) {
        if (e.key === 'Enter' && this.value.trim() !== "") {
            this.disabled = true; this.blur(); check(this.value.trim());
        }
    };

    function check(userAns) {
        const q = currentQuestions[currentIndex];
        let input = String(userAns).toLowerCase().trim().replace(/’/g, "'");
        let correctAns = String(q.answer).toLowerCase().replace(/’/g, "'");
        input = input.replace(/\s*\/\s*/g, '/');
        correctAns = correctAns.replace(/\s*\/\s*/g, '/');
        
        let isCorrect = false;
        let defArt = "";

        if (q.type === 'gender') {
            defArt = getDefArticle(q.word || q.word_or_question, q.answer).trim();
            if (currentMode === 'typing') {
                if (input === defArt || input === defArt.replace("'","") || input === correctAns) isCorrect = true;
            } else {
                if (input === correctAns) isCorrect = true;
            }
        } else {
            isCorrect = (input === correctAns);
        }

        const qId = getQuestionId(q);
        if (!answeredQuestions.includes(qId)) {
            answeredQuestions.push(qId);
            localStorage.setItem('fuken_answered', JSON.stringify(answeredQuestions));
        }

        if (!isCorrect) {
            if (!wrongQuestions.includes(qId)) {
                wrongQuestions.push(qId);
                localStorage.setItem('fuken_wrong', JSON.stringify(wrongQuestions));
            }
        } else {
            const wIndex = wrongQuestions.indexOf(qId);
            if (wIndex > -1) {
                wrongQuestions.splice(wIndex, 1);
                localStorage.setItem('fuken_wrong', JSON.stringify(wrongQuestions));
            }
        }

        saveResult(getCategory(q), isCorrect);

        const fb = document.getElementById('feedback');
        let displayAns = q.answer;
        if (q.type === 'gender') displayAns = defArt + (defArt.endsWith("'") ? "" : " ") + "(" + q.answer + ")";
        
        fb.textContent = isCorrect ? "Excellent !" : "正解 : " + displayAns;
        fb.style.color = isCorrect ? "var(--bleu)" : "var(--rouge)";
        
        if (isCorrect) score++;

        // ★ここで正誤の電子音（ピコーン/ブブー）を鳴らします
        playBeepSound(isCorrect);

        // その後、フランス語の読み上げを開始します
        let textToSpeak = "";
        if (q.type === 'gender') {
            textToSpeak = defArt + (defArt.endsWith("'") ? "" : " ") + (q.word || q.word_or_question);
        } else {
            textToSpeak = q.word_or_question;
            const answers = q.answer.split('/').map(s => s.trim());
            answers.forEach(ans => {
                textToSpeak = textToSpeak.replace(/\(\s*\)/, ans);
            });
        }
        textToSpeak = textToSpeak.replace(/\\n|\n/g, ' ').replace(/’/g, "'");
        speakFrench(textToSpeak);

        document.getElementById('commentary-text').innerHTML = (q.comment || "Pas de commentaire.").replace(/\\n|\n/g, '<br>');
        
        const nextBtn = document.getElementById('next-btn');
        if (currentIndex === currentQuestions.length - 1) {
            nextBtn.textContent = "Résultat (結果を見る)";
        } else {
            nextBtn.textContent = "Suivant (次へ)";
        }
        
        document.getElementById('feedback-area').style.display = "block";
        document.querySelectorAll('#choices-container button').forEach(b => b.disabled = true);
        if(currentMode === 'typing') document.getElementById('typing-input').style.display = 'none';
    }

    function handleNext() {
        currentIndex++;
        if (currentIndex < currentQuestions.length) showQuestion();
        else showResult();
    }

    function showResult() {
        switchScreen('result-screen');
        const maxScore = currentQuestions.length;
        document.getElementById('final-score').textContent = score + " / " + maxScore;
        const ratio = score / maxScore;
        document.getElementById('evaluation-msg').textContent = ratio >= 0.8 ? "Très bien ! その調子です。" : "Bon courage ! 復習しましょう。";
    }

    function switchScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    loadData();
</script>
</body>
</html>
