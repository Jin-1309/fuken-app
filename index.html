<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>仏検対策：フラ単ナビ</title>
    <style>
        :root { --primary: #002395; --accent: #EF4135; --bg: #f0f2f5; }
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background-color: var(--bg); display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        #app-container { background: white; padding: 2rem; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 95%; max-width: 450px; text-align: center; }
        .screen { display: none; }
        .screen.active { display: block; }
        h1 { color: var(--primary); font-size: 1.5rem; margin-bottom: 1rem; }
        .level-badge { background: var(--primary); color: white; padding: 4px 12px; border-radius: 20px; font-size: 0.8rem; margin-bottom: 0.5rem; display: inline-block; }
        .menu-btn { width: 100%; padding: 12px; margin-bottom: 10px; border: 2px solid #eee; border-radius: 12px; cursor: pointer; font-size: 1rem; font-weight: bold; background: white; transition: 0.2s; }
        .menu-btn:hover:not(:disabled) { border-color: var(--primary); background: #f0f4ff; }
        .question-text { font-size: 1.4rem; font-weight: bold; margin: 1rem 0; min-height: 3rem; display: flex; align-items: center; justify-content: center; }
        .meaning { color: #666; margin-bottom: 1rem; font-size: 0.9rem; }
        .grid-choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        #typing-input { width: 85%; padding: 12px; font-size: 1.2rem; border: 2px solid var(--primary); border-radius: 10px; text-align: center; }
        #commentary-box { display: none; background: #fffde7; border: 1px solid #ffe082; padding: 15px; border-radius: 10px; margin-top: 15px; text-align: left; font-size: 0.9rem; color: #5d4037; line-height: 1.4; }
        #next-btn { display: none; background: var(--primary); color: white; border: none; margin-top: 15px; }
        button:disabled { opacity: 0.6; }
        #feedback { margin-top: 1rem; font-weight: bold; font-size: 1.2rem; }
        .progress { margin-top: 1rem; color: #888; font-size: 0.8rem; }
    </style>
</head>
<body>

<div id="app-container">
    <div id="loading-screen" class="screen active"><h1>Loading...</h1></div>

    <div id="menu-screen" class="screen">
        <h1>仏検対策ドリル</h1>
        <div style="display:flex; flex-direction:column;">
            <button class="menu-btn" onclick="startQuiz('5級', 'choice')">5級 (4択)</button>
            <button class="menu-btn" onclick="startQuiz('4級', 'choice')">4級 (4択)</button>
            <button class="menu-btn" onclick="startQuiz('3級', 'choice')">3級 (4択)</button>
            <button class="menu-btn" onclick="startQuiz('2級', 'choice')">2級 (4択)</button>
            <button class="menu-btn" style="background:#eef;" onclick="startQuiz('ALL', 'choice')">全ミックス (4択)</button>
            <button class="menu-btn" style="border:2px dashed #ccc;" onclick="startQuiz('ALL', 'typing')">⌨️ タイピング挑戦</button>
        </div>
    </div>

    <div id="quiz-screen" class="screen">
        <div id="level-tag" class="level-badge"></div>
        <div id="question-display" class="question-text"></div>
        <div id="meaning-display" class="meaning"></div>
        <div id="choices-container" class="grid-choices"></div>
        <div id="typing-container" style="display:none;">
            <input type="text" id="typing-input" placeholder="入力..." autocomplete="off">
        </div>
        <div id="feedback"></div>
        <div id="commentary-box"><strong>💡 解説:</strong> <span id="commentary-text"></span></div>
        <button id="next-btn" class="menu-btn" onclick="handleNext()">次へ進む</button>
        <div class="progress">問題: <span id="current-count">0</span> / <span id="total-count">10</span></div>
    </div>

    <div id="result-screen" class="screen">
        <h2>結果発表</h2>
        <div style="font-size: 4rem; font-weight: bold; color: var(--primary);" id="final-score">0</div>
        <button class="menu-btn" onclick="location.reload()">メニューに戻る</button>
    </div>
</div>

<script>
    let database = [];
    let currentQuestions = [];
    let currentIndex = 0;
    let score = 0;
    let currentMode = 'choice';

    // --- 音声読み上げ機能 ---
    function speakFrench(text) {
        if (!('speechSynthesis' in window)) return;
        
        // すでに喋っている場合は止める
        window.speechSynthesis.cancel();

        const uttr = new SpeechSynthesisUtterance(text);
        uttr.lang = 'fr-FR'; // フランス語に設定
        uttr.rate = 0.9;     // 少しゆっくりめ
        uttr.pitch = 1.0;
        
        // ブラウザからフランス語の声を探す
        const voices = window.speechSynthesis.getVoices();
        const frVoice = voices.find(v => v.lang.startsWith('fr'));
        if (frVoice) uttr.voice = frVoice;

        window.speechSynthesis.speak(uttr);
    }

    async function loadData() {
        try {
            const response = await fetch('questions.json?t=' + Date.now());
            database = await response.json();
            document.getElementById('loading-screen').classList.remove('active');
            document.getElementById('menu-screen').classList.add('active');
        } catch (e) { console.error("Load error"); }
    }

    function startQuiz(lvl, mode) {
        currentMode = mode;
        let filtered = (lvl === 'ALL') ? [...database] : database.filter(q => q.level === lvl);
        currentQuestions = filtered.sort(() => 0.5 - Math.random()).slice(0, 10);
        if (currentQuestions.length === 0) return alert("問題がありません");
        currentIndex = 0; score = 0;
        switchScreen('quiz-screen');
        showQuestion();
    }

    function showQuestion() {
        const q = currentQuestions[currentIndex];
        document.getElementById('level-tag').textContent = q.level;
        document.getElementById('current-count').textContent = currentIndex + 1;
        document.getElementById('total-count').textContent = currentQuestions.length;
        document.getElementById('feedback').textContent = "";
        document.getElementById('commentary-box').style.display = "none";
        document.getElementById('next-btn').style.display = "none";
        document.getElementById('question-display').textContent = q.type === 'gender' ? q.word : q.word_or_question;
        document.getElementById('meaning-display').textContent = q.meaning;
        
        const choicesDiv = document.getElementById('choices-container');
        const typingDiv = document.getElementById('typing-container');
        const input = document.getElementById('typing-input');

        if (currentMode === 'choice') {
            choicesDiv.style.display = 'grid';
            typingDiv.style.display = 'none';
            choicesDiv.innerHTML = "";
            const choices = q.type === 'gender' ? ["男性", "女性"] : [q.choice1, q.choice2, q.choice3, q.choice4].filter(c => c);
            choices.forEach(c => {
                const btn = document.createElement('button');
                btn.className = 'menu-btn';
                btn.textContent = c;
                btn.onclick = () => check(c);
                choicesDiv.appendChild(btn);
            });
        } else {
            choicesDiv.style.display = 'none';
            typingDiv.style.display = 'block';
            input.value = ""; input.disabled = false; input.focus();
        }
    }

    document.getElementById('typing-input').onkeypress = function(e) {
        if (e.key === 'Enter' && this.value.trim() !== "") {
            this.disabled = true;
            check(this.value.trim());
        }
    };

    function check(userAns) {
        const q = currentQuestions[currentIndex];
        let correctAns = q.answer.toLowerCase();
        let input = userAns.toLowerCase();
        let isCorrect = false;

        if (currentMode === 'typing' && q.type === 'gender') {
            if ((correctAns === "男性" && input === "un") || (correctAns === "女性" && input === "une") || input === correctAns) isCorrect = true;
        } else {
            isCorrect = (input === correctAns);
        }

        const fb = document.getElementById('feedback');
        fb.textContent = isCorrect ? "C'est bien ! 正解" : "残念... 正解は " + (q.type === 'gender' ? (q.answer === "男性" ? "un" : "une") : q.answer);
        fb.style.color = isCorrect ? "#4CAF50" : "#EF4135";
        
        if (isCorrect) {
            score++;
            // --- 正解時に読み上げを実行 ---
            let textToSpeak = "";
            if (q.type === 'gender') {
                // 性別問題なら冠詞をつけて読む
                textToSpeak = (q.answer === "男性" ? "un " : "une ") + q.word;
            } else {
                // 文章問題ならカッコを正解で埋めて読む
                textToSpeak = q.word_or_question.replace("(   )", q.answer);
            }
            speakFrench(textToSpeak);
        }

        if (q.comment) {
            document.getElementById('commentary-text').textContent = q.comment;
            document.getElementById('commentary-box').style.display = "block";
        }

        document.querySelectorAll('#choices-container button').forEach(b => b.disabled = true);
        document.getElementById('next-btn').style.display = "block";
    }

    function handleNext() {
        currentIndex++;
        if (currentIndex < currentQuestions.length) showQuestion();
        else showResult();
    }

    function showResult() {
        switchScreen('result-screen');
        document.getElementById('final-score').textContent = score + " / " + currentQuestions.length;
    }

    function switchScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    loadData();
</script>
</body>
</html>
