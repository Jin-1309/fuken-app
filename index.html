<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>仏検対策：フラ単ナビ Pro</title>
    <style>
        :root { --primary: #002395; --accent: #EF4135; --bg: #f0f2f5; --success: #4CAF50; }
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background-color: var(--bg); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        #app-container { background: white; padding: 2rem; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 95%; max-width: 450px; text-align: center; position: relative; }
        
        .screen { display: none; }
        .screen.active { display: block; }

        h1 { color: var(--primary); font-size: 1.5rem; margin-bottom: 1rem; }
        
        /* 級別バッジ */
        .level-badge { background: var(--primary); color: white; padding: 4px 12px; border-radius: 20px; font-size: 0.8rem; margin-bottom: 0.5rem; display: inline-block; }

        /* メニューボタン */
        .menu-grid { display: grid; grid-template-columns: 1fr; gap: 10px; margin-top: 15px; }
        .menu-btn { width: 100%; padding: 14px; border: 2px solid #eee; border-radius: 12px; cursor: pointer; font-size: 1rem; font-weight: bold; background: white; transition: 0.2s; }
        .menu-btn:hover:not(:disabled) { border-color: var(--primary); background: #f0f4ff; }
        .btn-mix { background-color: #eef4ff; color: var(--primary); }
        .btn-typing { border: 2px dashed #ccc; background-color: #f8f9fa; }

        /* 分析エリア */
        .stats-container { background: #fdfdfd; padding: 15px; border: 1px solid #eee; border-radius: 15px; margin-bottom: 20px; text-align: left; }
        .stat-row { margin-bottom: 8px; }
        .stat-label { font-size: 0.75rem; color: #666; display: flex; justify-content: space-between; margin-bottom: 2px; }
        .bar-bg { background: #eee; height: 6px; border-radius: 3px; overflow: hidden; }
        .bar-fill { background: var(--primary); height: 100%; width: 0%; transition: width 0.6s ease; }
        .weak { background: var(--accent) !important; }
        .strong { background: var(--success) !important; }
        .clear-btn { font-size: 0.7rem; color: #aaa; background: none; border: none; text-decoration: underline; cursor: pointer; margin-top: 10px; display: block; width: 100%; text-align: right; }

        /* クイズ表示 */
        .question-text { font-size: 1.6rem; font-weight: bold; margin: 1rem 0; min-height: 3.5rem; display: flex; align-items: center; justify-content: center; color: #333; }
        .meaning { color: #666; margin-bottom: 1.5rem; font-size: 0.95rem; min-height: 1.2rem; }
        .grid-choices { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        
        /* タイピング入力 */
        #typing-input { width: 85%; padding: 12px; font-size: 1.2rem; border: 2px solid var(--primary); border-radius: 10px; text-align: center; margin: 10px auto; display: block; }
        
        /* フィードバック・解説 */
        #feedback { margin-top: 1rem; font-weight: bold; font-size: 1.3rem; height: 1.5rem; }
        #feedback-area { display: none; }
        #commentary-box { background: #fffde7; border: 1px solid #ffe082; padding: 15px; border-radius: 12px; margin-top: 15px; text-align: left; font-size: 0.85rem; line-height: 1.5; color: #5d4037; }
        #audio-repeat-btn { background: var(--primary); color: white; border: none; border-radius: 50%; width: 40px; height: 40px; cursor: pointer; margin: 10px auto; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; }
        
        .next-btn { background: var(--primary) !important; color: white !important; border: none !important; margin-top: 15px; }
        .progress { margin-top: 1.5rem; color: #aaa; font-size: 0.8rem; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
</head>
<body>

<div id="app-container">
    <!-- ロード画面 -->
    <div id="loading-screen" class="screen active"><h1>Chargement...</h1><p>読み込み中</p></div>

    <!-- ダッシュボード画面 -->
    <div id="menu-screen" class="screen">
        <h1>🇫🇷 仏検ダッシュボード</h1>
        
        <div class="stats-container">
            <small style="font-weight: bold; color: #444;">📊 カテゴリー別正解率</small>
            <div id="stats-list" style="margin-top: 10px;"></div>
            <button class="clear-btn" onclick="clearHistory()">履歴リセット</button>
        </div>

        <div class="menu-grid">
            <button class="menu-btn" onclick="startQuiz('5級', 'choice')">5級レベル</button>
            <button class="menu-btn" onclick="startQuiz('4級', 'choice')">4級レベル</button>
            <button class="menu-btn" onclick="startQuiz('3級', 'choice')">3級レベル</button>
            <button class="menu-btn" onclick="startQuiz('2級', 'choice')">2級レベル</button>
            <button class="menu-btn btn-mix" onclick="startQuiz('ALL', 'choice')">🔄 全級ミックス (4択)</button>
            <button class="menu-btn btn-typing" onclick="startQuiz('ALL', 'typing')">⌨️ 全級タイピング挑戦</button>
        </div>
    </div>

    <!-- クイズ画面 -->
    <div id="quiz-screen" class="screen">
        <div id="level-tag" class="level-badge"></div>
        <div id="question-display" class="question-text"></div>
        <div id="meaning-display" class="meaning"></div>
        
        <div id="choices-container" class="grid-choices"></div>
        
        <div id="typing-container" style="display:none;">
            <input type="text" id="typing-input" placeholder="答えを入力..." autocomplete="off" spellcheck="false">
        </div>

        <div id="feedback"></div>

        <div id="feedback-area">
            <button id="audio-repeat-btn" onclick="replayAudio()">🔊</button>
            <div id="commentary-box"><strong>💡 解説:</strong><br><span id="commentary-text"></span></div>
            <button class="menu-btn next-btn" onclick="handleNext()">次へ進む</button>
        </div>

        <div class="progress">問題: <span id="current-count">0</span> / 10</div>
    </div>

    <!-- 結果画面 -->
    <div id="result-screen" class="screen">
        <h2>今回の結果</h2>
        <div style="font-size: 4rem; font-weight: bold; color: var(--primary); margin: 20px 0;" id="final-score">0</div>
        <p id="evaluation-msg" style="font-weight: bold; color: #666;"></p>
        <button class="menu-btn next-btn" onclick="location.reload()">ダッシュボードに戻る</button>
    </div>
</div>

<script>
    let database = [];
    let currentQuestions = [];
    let currentIndex = 0;
    let score = 0;
    let currentMode = 'choice';
    let lastSpokenText = "";

    // 履歴保存
    let history = JSON.parse(localStorage.getItem('fuken_history')) || {};

    function speakFrench(text) {
        if (!('speechSynthesis' in window)) return;
        window.speechSynthesis.cancel();
        const uttr = new SpeechSynthesisUtterance(text);
        uttr.lang = 'fr-FR';
        uttr.rate = 0.9;
        window.speechSynthesis.speak(uttr);
        lastSpokenText = text;
    }

    function replayAudio() { if (lastSpokenText) speakFrench(lastSpokenText); }

    function saveResult(category, isCorrect) {
        if (!history[category]) history[category] = { correct: 0, total: 0 };
        history[category].total += 1;
        if (isCorrect) history[category].correct += 1;
        localStorage.setItem('fuken_history', JSON.stringify(history));
    }

    function renderStats() {
        const list = document.getElementById('stats-list');
        list.innerHTML = "";
        const categories = ["名詞の性", "動詞の活用", "前置詞・文法", "熟語・表現"];
        categories.forEach(cat => {
            const data = history[cat] || { correct: 0, total: 0 };
            const percent = data.total > 0 ? Math.round((data.correct / data.total) * 100) : 0;
            let colorClass = (percent < 50 && data.total > 0) ? "weak" : (percent > 80 ? "strong" : "");
            list.innerHTML += `
                <div class="stat-row">
                    <div class="stat-label"><span>${cat}</span><span>${percent}% (${data.correct}/${data.total})</span></div>
                    <div class="bar-bg"><div class="bar-fill ${colorClass}" style="width: ${percent}%"></div></div>
                </div>`;
        });
    }

    function clearHistory() {
        if (confirm("全ての学習履歴をリセットしますか？")) {
            localStorage.removeItem('fuken_history');
            history = {};
            renderStats();
        }
    }

    async function loadData() {
        try {
            const response = await fetch('questions.json?t=' + Date.now());
            database = await response.json();
            renderStats();
            document.getElementById('loading-screen').classList.remove('active');
            document.getElementById('menu-screen').classList.add('active');
        } catch (e) { document.getElementById('loading-screen').innerHTML = "Loading Error"; }
    }

    function startQuiz(lvl, mode) {
        currentMode = mode;
        let filtered = (lvl === 'ALL') ? [...database] : database.filter(q => q.level === lvl);
        currentQuestions = filtered.sort(() => 0.5 - Math.random()).slice(0, 10);
        if (currentQuestions.length === 0) return alert("問題がありません");
        currentIndex = 0; score = 0;
        switchScreen('quiz-screen');
        showQuestion();
    }

    function getCategory(q) {
        if (q.category) return q.category;
        if (q.type === 'gender') return "名詞の性";
        const qText = q.word_or_question || "";
        if (qText.includes('de') || qText.includes('à') || q.level === '2級') return "前置詞・文法";
        if (q.meaning.includes('ばかり') || q.meaning.includes('つもり')) return "動詞の活用";
        return "熟語・表現";
    }

    function showQuestion() {
        const q = currentQuestions[currentIndex];
        document.getElementById('level-tag').textContent = q.level + (currentMode === 'typing' ? ' [⌨️]' : '');
        document.getElementById('current-count').textContent = currentIndex + 1;
        document.getElementById('question-display').textContent = q.type === 'gender' ? q.word : q.word_or_question;
        document.getElementById('meaning-display').textContent = q.meaning;
        document.getElementById('feedback').textContent = "";
        document.getElementById('feedback-area').style.display = "none";
        
        const choicesDiv = document.getElementById('choices-container');
        const typingDiv = document.getElementById('typing-container');
        const input = document.getElementById('typing-input');

        if (currentMode === 'choice') {
            choicesDiv.style.display = 'grid';
            typingDiv.style.display = 'none';
            choicesDiv.innerHTML = "";
            const choices = q.type === 'gender' ? ["男性", "女性"] : [q.choice1, q.choice2, q.choice3, q.choice4].filter(c => c);
            choices.forEach(c => {
                const btn = document.createElement('button');
                btn.className = 'menu-btn';
                btn.textContent = c;
                btn.onclick = () => check(c);
                choicesDiv.appendChild(btn);
            });
        } else {
            choicesDiv.style.display = 'none';
            typingDiv.style.display = 'block';
            input.style.display = 'block';
            input.value = ""; input.disabled = false; input.focus();
        }
    }

    document.getElementById('typing-input').onkeypress = function(e) {
        if (e.key === 'Enter' && this.value.trim() !== "") {
            this.disabled = true;
            check(this.value.trim());
        }
    };

    function check(userAns) {
        const q = currentQuestions[currentIndex];
        let input = userAns.toLowerCase();
        let correctAns = q.answer.toLowerCase();
        let isCorrect = (input === correctAns);

        if (currentMode === 'typing' && q.type === 'gender') {
            if ((correctAns === "男性" && input === "un") || (correctAns === "女性" && input === "une") || input === correctAns) isCorrect = true;
        }

        saveResult(getCategory(q), isCorrect);

        const fb = document.getElementById('feedback');
        fb.textContent = isCorrect ? "C'est bien !" : "正解: " + (q.type === 'gender' ? (q.answer === "男性" ? "un" : "une") : q.answer);
        fb.style.color = isCorrect ? "var(--success)" : "var(--accent)";
        if (isCorrect) score++;

        speakFrench(q.type === 'gender' ? (q.answer === "男性" ? "un " : "une ") + q.word : q.word_or_question.replace("(   )", q.answer));

        document.getElementById('commentary-text').textContent = q.comment || "解説はありません。";
        document.getElementById('feedback-area').style.display = "block";
        document.querySelectorAll('#choices-container button').forEach(b => b.disabled = true);
        if(currentMode === 'typing') document.getElementById('typing-input').style.display = 'none';
    }

    function handleNext() {
        currentIndex++;
        if (currentIndex < currentQuestions.length) showQuestion();
        else showResult();
    }

    function showResult() {
        switchScreen('result-screen');
        document.getElementById('final-score').textContent = score + " / 10";
        document.getElementById('evaluation-msg').textContent = score >= 8 ? "Bravo ! その調子です！" : "お疲れ様でした。復習しましょう！";
    }

    function switchScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    loadData();
</script>
</body>
</html>
